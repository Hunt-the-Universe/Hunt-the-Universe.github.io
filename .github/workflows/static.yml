name: Deploy Astro site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and upload site
        uses: withastro/action@v6
        with:
          node-version: 24
          build-cmd: pnpm build
          out-dir: dist
      - name: Verify Pages output
        run: |
          test -s dist/index.html
          for page in register partner rules tips who clues; do
            test -s "dist/${page}/index.html"
          done
          test ! -e dist/legacy-site
          test "$(cat dist/CNAME)" = hunttheuniverse.com
          grep -Fq '<title>Hunt the Universe</title>' dist/index.html
          ! grep -Fq 'Editorial by HTML5 UP' dist/index.html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
